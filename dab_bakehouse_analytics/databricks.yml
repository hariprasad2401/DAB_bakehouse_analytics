# This is a Declarative Automation Bundle definition for dab_bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_bakehouse_analytics
  uuid: c0457033-f30e-4f7a-892b-df0e8cd0ba82

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5367e017-19d5.cloud.databricks.com
    variables:
      catalog: dev_dab_bakehouse
      schema: dev
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-5367e017-19d5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/hariprasadkulkarni2130@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hariprasadkulkarni2130@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_dab_bakehouse
      schema: prod
      
    permissions:
      - user_name: hariprasadkulkarni2130@gmail.com
        level: CAN_MANAGE
